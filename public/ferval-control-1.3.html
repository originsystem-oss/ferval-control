<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FERVAL CONTROL</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.top{padding:18px;border-bottom:1px solid #263449;display:flex;justify-content:space-between;align-items:center}.top b{font-size:20px}.muted{color:#94a3b8;font-size:12px}.login{margin:auto;width:min(92%,430px);background:#101b2d;border:1px solid #263449;border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}.hidden{display:none!important}input,button{font:inherit}.login input,.bar input{background:#111c2e;color:white;border:1px solid #334155;border-radius:13px;padding:14px;font-size:16px}.login button,.bar button,.top button,.mini{border:0;border-radius:12px;padding:12px 16px;font-weight:700}.primary{background:#2563eb;color:white}.secondary{background:#182235;color:#e2e8f0;border:1px solid #334155!important}.err{color:#fca5a5;font-size:13px}.ok{color:#86efac;font-size:13px}.chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.m{max-width:86%;padding:12px 14px;border-radius:15px;white-space:pre-wrap;line-height:1.35}.u{align-self:flex-end;background:#2563eb}.a{align-self:flex-start;background:#1e293b}.bar{display:flex;gap:8px;padding:12px;border-top:1px solid #263449}.bar input{flex:1}.mic{min-width:56px;padding:0 14px!important;font-size:22px}.mic.listening{outline:3px solid #60a5fa}.quickLabel{font-size:12px;color:#94a3b8;margin-bottom:8px}.status{padding:0 16px 9px;color:#94a3b8;font-size:12px}.badge{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;background:#1d4ed8;font-size:11px}.admin{padding:12px 18px;border-bottom:1px solid #263449}.userrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #263449}.mini{padding:8px 10px;background:#2563eb;color:white}.mini.alt{background:#475569}.sharebox{display:flex;gap:6px;margin-top:8px}.sharebox input{flex:1;background:#111c2e;color:white;border:1px solid #334155;border-radius:9px;padding:9px}.sectionTitle{margin-top:14px;color:#cbd5e1;font-size:13px;font-weight:700}</style></head><body>
<div id="login" class="login"><h2 style="margin:0">FERVAL CONTROL</h2><div class="muted">Acceso identificado · YAYO 1.3</div><input id="name" class="hidden" placeholder="Nombre y apellidos"><input id="email" type="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button id="go" class="primary">Entrar</button><button id="mode" class="secondary">Crear cuenta</button><div id="msg"></div></div>
<div id="app" class="shell hidden"><div class="top"><div><b>FERVAL CONTROL</b><span id="badge" class="badge"></span><div id="who" class="muted"></div></div><button id="out" class="secondary">Salir</button></div><div id="admin" class="admin hidden"><b>Usuarios y permisos</b><div id="pending"></div><div id="activeUsers"></div><div class="sectionTitle">Historial de Dirección</div><div id="audit"></div></div><div id="quick" class="admin hidden"><div id="quickLabel" class="quickLabel"></div><div class="sharebox"><button id="qParte" class="mini">Parte</button><button id="qEscalar" class="mini alt">Escalar</button><button id="qRecuerda" class="mini alt">Recuerda</button></div></div><div id="chat" class="chat"></div><div id="status" class="status"></div><form id="form" class="bar"><input id="input" placeholder="Escribe o habla a Yayo…" autocomplete="off"><button id="mic" type="button" class="secondary mic" aria-label="Hablar">🎙️</button><button class="primary">Enviar</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://jbzkofvtoyuqtlwmhiiw.supabase.co', SB_KEY='sb_publishable_EChIRAIJTQouhokG-U2ENA_6nLDTYuf';
const FN='https://jbzkofvtoyuqtlwmhiiw.supabase.co/functions/v1/ferval-control-v13';
const sb=window.supabase.createClient(SB_URL,SB_KEY), $=id=>document.getElementById(id);let signup=false,me=null,sid='';
function add(t,k){const d=document.createElement('div');d.className='m '+k;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
async function profile(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data:p,error}=await sb.from('app_profiles').select('user_id,display_name,access_level,active').eq('user_id',user.id).maybeSingle();if(error)throw error;return p}
async function loadPending(){
  if(me?.access_level!=='N1')return;
  $('admin').classList.remove('hidden');
  const {data,error}=await sb.from('app_profiles').select('user_id,display_name,access_level,active').order('display_name');
  const pending=$('pending'), active=$('activeUsers');
  if(error){pending.innerHTML='<div class="err">'+error.message+'</div>';return}
  const rows=data||[];
  const pend=rows.filter(x=>!x.active);
  const act=rows.filter(x=>x.active&&x.access_level!=='N1');
  pending.innerHTML='<div class="sectionTitle">Pendientes</div>'+(
    pend.map(x=>'<div class="userrow"><div><b>'+x.display_name+'</b><div class="muted">pendiente</div></div><div><button class="mini" data-n2="'+x.user_id+'">N2</button> <button class="mini alt" data-n3="'+x.user_id+'">N3</button></div></div>').join('')
    ||'<div class="muted" style="padding-top:8px">No hay usuarios pendientes</div>'
  );
  active.innerHTML='<div class="sectionTitle">Usuarios activos</div>'+(
    act.map(x=>'<div class="userrow"><div style="flex:1"><b>'+x.display_name+'</b><div class="muted">'+x.access_level+'</div><div class="sharebox"><input id="share_'+x.user_id+'" placeholder="Compartir sólo información operativa"><button class="mini" data-share="'+x.user_id+'">Compartir</button></div><div id="shares_'+x.user_id+'" class="muted" style="margin-top:8px"></div><div style="margin-top:8px"><button class="mini alt" data-loadshares="'+x.user_id+'">Ver compartido</button> <button class="mini alt" data-role="'+x.user_id+'" data-level="'+(x.access_level==='N2'?'N3':'N2')+'">Cambiar a '+(x.access_level==='N2'?'N3':'N2')+'</button> <button class="mini alt" data-disable="'+x.user_id+'">Desactivar</button></div></div></div>').join('')
    ||'<div class="muted" style="padding-top:8px">No hay usuarios N2/N3 activos</div>'
  );
  document.querySelectorAll('[data-n2]').forEach(b=>b.onclick=()=>activateUser(b.dataset.n2,'N2'));
  document.querySelectorAll('[data-n3]').forEach(b=>b.onclick=()=>activateUser(b.dataset.n3,'N3'));
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareToUser(b.dataset.share));
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>changeRole(b.dataset.role,b.dataset.level));
  document.querySelectorAll('[data-disable]').forEach(b=>b.onclick=()=>disableUser(b.dataset.disable));
  document.querySelectorAll('[data-loadshares]').forEach(b=>b.onclick=()=>loadShares(b.dataset.loadshares));
}
async function activateUser(id,level){
  const {error}=await sb.from('app_profiles').update({active:true,access_level:level}).eq('user_id',id);
  if(error)return alert(error.message);
  await sb.from('yayo_user_permissions').upsert({user_id:id,can_checkin:true,can_escalate:true,can_store_memory:true,can_receive_direction_shares:true,updated_by:me.user_id});
  loadPending();loadAudit();
}
async function shareToUser(id){
  const input=$('share_'+id), content=input.value.trim();
  if(!content)return;
  const key='direction_'+Date.now();
  const {error}=await sb.from('direction_user_shares').insert({user_id:id,share_key:key,content,category:'operational',created_by:me.user_id,active:true});
  if(error)return alert(error.message);
  input.value='';loadAudit();
  alert('Información operativa compartida sólo con ese usuario.');
}
async function changeRole(id,level){
  const {error}=await sb.from('app_profiles').update({access_level:level}).eq('user_id',id);
  if(error)return alert(error.message);
  loadPending();loadAudit();
}
async function disableUser(id){
  const {error}=await sb.from('app_profiles').update({active:false,disabled_at:new Date().toISOString(),disabled_reason:'Desactivado por Dirección'}).eq('user_id',id);
  if(error)return alert(error.message);
  loadPending();loadAudit();
}
async function loadAudit(){
  const {data,error}=await sb.from('app_audit_log').select('action,entity_type,entity_id,detail,created_at').order('created_at',{ascending:false}).limit(20);
  const box=$('audit');
  if(error){box.innerHTML='<div class="err">'+error.message+'</div>';return}
  box.innerHTML=(data||[]).map(x=>'<div class="muted" style="padding:6px 0;border-bottom:1px solid #263449"><b>'+x.action+'</b> · '+new Date(x.created_at).toLocaleString()+'<br>'+x.entity_type+' · '+x.entity_id+'</div>').join('')||'<div class="muted">Sin cambios registrados</div>';
}
async function loadShares(id){
  const {data,error}=await sb.from('direction_user_shares').select('id,content,active,created_at').eq('user_id',id).eq('active',true).order('created_at',{ascending:false});
  const box=$('shares_'+id);
  if(error){box.textContent=error.message;return}
  box.innerHTML=(data||[]).map(x=>'<div style="padding:5px 0">'+x.content+' <button class="mini alt" style="padding:4px 7px" data-revoke="'+x.id+'">Retirar</button></div>').join('')||'Nada compartido';
  box.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{const {error}=await sb.from('direction_user_shares').update({active:false}).eq('id',b.dataset.revoke);if(error)alert(error.message);else{loadShares(id);loadAudit()}});
}
async function boot(){try{me=await profile();if(!me){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}if(!me.active){$('msg').innerHTML='<span class="err">Tu cuenta está pendiente de activación por Dirección.</span>';await sb.auth.signOut();$('login').classList.remove('hidden');$('app').classList.add('hidden');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.display_name;$('badge').textContent=me.access_level;$('quick').classList.remove('hidden');$('quickLabel').textContent=me.access_level==='N1'?'Accesos rápidos de Dirección':'Accesos rápidos';$('qEscalar').classList.toggle('hidden',me.access_level==='N1');sid=localStorage.getItem('ferval13_'+me.user_id)||crypto.randomUUID();localStorage.setItem('ferval13_'+me.user_id,sid);$('chat').innerHTML='';await loadPending();if(me.access_level==='N1')await loadAudit();const {data:{session}}=await sb.auth.getSession();const r=await fetch(FN+'/history?sid='+encodeURIComponent(sid),{headers:{Authorization:'Bearer '+session.access_token}});const j=await r.json();for(const x of j.history||[])add(x.content,x.role==='assistant'?'a':'u');if(!(j.history||[]).length)add('Estoy aquí. ¿Qué necesitas?','a')}catch(e){$('msg').innerHTML='<span class="err">'+String(e.message||e)+'</span>'}}
$('mode').onclick=()=>{signup=!signup;$('name').classList.toggle('hidden',!signup);$('go').textContent=signup?'Registrar':'Entrar';$('mode').textContent=signup?'Ya tengo cuenta':'Crear cuenta';$('msg').textContent=''}
$('go').onclick=async()=>{$('msg').textContent='';if(signup){const name=$('name').value.trim(),email=$('email').value.trim(),password=$('pass').value;if(!name||!email||password.length<8){$('msg').innerHTML='<span class="err">Completa nombre, correo y una contraseña de 8 caracteres o más.</span>';return}const {error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error){$('msg').innerHTML='<span class="err">'+error.message+'</span>';return}$('msg').innerHTML='<span class="ok">Cuenta creada. Dirección debe activarla antes de entrar.</span>';return}const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error){$('msg').innerHTML='<span class="err">'+error.message+'</span>';return}await boot()}
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()}
$('qParte').onclick=()=>{$('input').value='PARTE: ';$('input').focus()}
$('qEscalar').onclick=()=>{$('input').value='ESCALAR: ';$('input').focus()}
$('qRecuerda').onclick=()=>{$('input').value='RECUERDA: ';$('input').focus()}

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,listening=false;
if(SpeechRecognition){
  recognition=new SpeechRecognition();
  recognition.lang='es-ES';
  recognition.interimResults=true;
  recognition.continuous=false;
  recognition.onstart=()=>{listening=true;$('mic').classList.add('listening');$('status').textContent='Escuchando…'};
  recognition.onresult=e=>{
    let finalText='',interim='';
    for(let n=e.resultIndex;n<e.results.length;n++){
      const t=e.results[n][0].transcript;
      if(e.results[n].isFinal) finalText+=t; else interim+=t;
    }
    $('input').value=(finalText||interim).trim();
  };
  recognition.onerror=e=>{
    listening=false;$('mic').classList.remove('listening');
    $('status').textContent=e.error==='not-allowed'?'Activa el permiso de micrófono para hablar con Yayo.':'No he podido escuchar. Puedes seguir escribiendo.';
  };
  recognition.onend=()=>{
    listening=false;$('mic').classList.remove('listening');
    if($('status').textContent==='Escuchando…')$('status').textContent='';
    $('input').focus();
  };
}
$('mic').onclick=()=>{
  if(!recognition){
    $('status').textContent='El reconocimiento de voz no está disponible en este navegador. Puedes seguir escribiendo.';
    return;
  }
  try{
    if(listening) recognition.stop(); else recognition.start();
  }catch{}
}
$('form').onsubmit=async e=>{e.preventDefault();const t=$('input').value.trim();if(!t)return;$('input').value='';add(t,'u');$('status').textContent='Yayo está pensando…';try{const {data:{session}}=await sb.auth.getSession();const r=await fetch(FN+'/chat',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({message:t,sid})});const j=await r.json();add(j.reply||j.error||'No he podido responder.','a')}catch(e){add('No he podido conectar.','a')}finally{$('status').textContent=''}}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)await boot()})();
</script></body></html>
