async function loadHistory(){
 $('moduleTitle').textContent='Historial';$('moduleText').textContent='Conversaciones registradas de esta cuenta';$('moduleContent').innerHTML='<div class="muted">Cargando historial…</div>';showView('moduleView');
 const{data,error}=await sb.from('yayo_session_messages').select('session_key,role,body,created_at').order('created_at',{ascending:false}).limit(80);if(error)throw error;
 const rows=data||[];$('moduleContent').innerHTML=rows.length?rows.map(m=>'<div class="userrow"><div class="muted">'+esc(new Date(m.created_at).toLocaleString('es-ES'))+' · '+esc(m.role)+'</div><div>'+esc(m.body)+'</div></div>').join(''):'<div class="muted">Todavía no hay mensajes registrados.</div>';
}
async function loadTeam(){
 if(me?.access_level!=='N1'){throw new Error('Sólo Dirección N1 puede gestionar Equipo y permisos.')}
 $('moduleTitle').textContent='Equipo y permisos';$('moduleText').textContent='Usuarios de FERVAL CONTROL · niveles N1 / N2 / N3';$('moduleContent').innerHTML='<div class="muted">Cargando usuarios…</div>';showView('moduleView');
 const{data,error}=await sb.from('app_profiles').select('user_id,display_name,access_level,active').order('display_name');if(error)throw error;
 const rows=data||[];$('moduleContent').innerHTML=rows.map(u=>'<div class="userrow"><b>'+esc(u.display_name)+'</b><div class="muted">'+esc(u.access_level)+' · '+(u.active?'Activo':'Pendiente / desactivado')+'</div>'+(u.access_level!=='N1'?'<div class="actions">'+(!u.active?'<button class="mini" data-activate="'+u.user_id+'" data-level="N2">Activar N2</button><button class="mini" data-activate="'+u.user_id+'" data-level="N3">Activar N3</button>':'<button class="mini alt" data-disable="'+u.user_id+'">Desactivar</button>')+'</div>':'')+'</div>').join('');
 document.querySelectorAll('[data-activate]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('app_profiles').update({active:true,access_level:b.dataset.level}).eq('user_id',b.dataset.activate);if(error)alert(error.message);else loadTeam()});
 document.querySelectorAll('[data-disable]').forEach(b=>b.onclick=async()=>{const{error}=await sb.from('app_profiles').update({active:false}).eq('user_id',b.dataset.disable);if(error)alert(error.message);else loadTeam()});
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{if(b.dataset.view==='documentos'){try{await loadDocuments()}catch(e){$('moduleTitle').textContent='Documentos';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}if(b.dataset.view==='obras'){try{await loadWorks()}catch(e){$('moduleTitle').textContent='Obras';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}if(b.dataset.view==='pulse'){try{await loadPulse()}catch(e){$('moduleTitle').textContent='Yayo Pulse';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}if(b.dataset.view==='control'){try{await loadDaily()}catch(e){$('moduleTitle').textContent='Control Diario';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}if(b.dataset.view==='guardia'){try{await loadGuard()}catch(e){$('moduleTitle').textContent='Guardia Dirección';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}if(b.dataset.view==='historial'){try{await loadHistory()}catch(e){$('moduleTitle').textContent='Historial';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}if(b.dataset.view==='equipo'){try{await loadTeam()}catch(e){$('moduleTitle').textContent='Equipo y permisos';$('moduleText').textContent='';$('moduleContent').innerHTML='<div class="err">'+esc(e.message||e)+'</div>';showView('moduleView')}return}const names={obras:'Obras',historial:'Historial',estado:'Estado del sistema',chats:'Chats usuarios',guardia:'Guardia Dirección',control:'Control Diario',ayuda:'Ayuda'};$('moduleTitle').textContent=names[b.dataset.view]||'Módulo';$('moduleText').textContent='Módulo preparado visualmente. Se activará después de su prueba individual.';$('moduleContent').innerHTML='';showView('moduleView')});

$('send').addEventListener('click',send);$('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
