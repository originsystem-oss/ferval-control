<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FERVAL CONTROL</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}.wrap{max-width:720px;margin:auto;min-height:100dvh}.login{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(100%,420px);background:#101b2d;border:1px solid #263449;border-radius:20px;padding:24px}.field,.btn{width:100%;padding:14px;border-radius:12px;font:inherit;margin:6px 0}.field{background:#0b1627;color:#fff;border:1px solid #334155}.btn{border:0;background:#2563eb;color:#fff;font-weight:800}.secondary{background:#182235}.muted{color:#94a3b8}.err{color:#fca5a5}.ok{color:#86efac}.head{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #263449}.head .btn{width:auto}.home{padding:18px}.hero{background:#101b2d;border:1px solid #263449;border-radius:18px;padding:18px}.chat{height:55vh;overflow:auto;padding:16px;background:#0b1627;border-radius:16px;margin-top:14px}.m{padding:10px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.u{background:#2563eb;margin-left:18%}.a{background:#1e293b;margin-right:18%}.bar{display:flex;gap:8px;margin-top:10px}.bar .field{margin:0}.bar .btn{width:auto;margin:0}</style></head><body><div class="wrap">
<div id="login" class="login"><div class="card"><h1>FERVAL CONTROL</h1><div class="muted">Núcleo estable · Yayo</div><input id="email" class="field" type="email" placeholder="Correo"><input id="pass" class="field" type="password" placeholder="Contraseña"><button id="go" class="btn">Entrar</button><div id="msg"></div></div></div>
<div id="app" class="hidden"><div class="head"><div><b>FERVAL CONTROL</b><div id="who" class="muted"></div></div><button id="out" class="btn secondary">Salir</button></div><main class="home"><div class="hero"><h2>Yayo</h2><div class="muted">Núcleo estable. Conversación empresarial activa.</div></div><div id="chat" class="chat"></div><div class="bar"><input id="input" class="field" placeholder="Escribe a Yayo"><button id="send" class="btn">Enviar</button></div><div id="status" class="muted"></div></main></div>
</div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL='https://jbzkofvtoyuqtlwmhiiw.supabase.co';
const SUPABASE_KEY='__SUPABASE_KEY__';
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let me=null,sid='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));
async function openApp(){
 const{data:{user}}=await sb.auth.getUser();if(!user)return;
 const{data,error}=await sb.from('app_profiles').select('user_id,display_name,access_level,active').eq('user_id',user.id).single();
 if(error)throw error;if(!data.active){await sb.auth.signOut();throw new Error('Cuenta pendiente de activación por Dirección.')}
 me=data;sid='stable_'+me.user_id+'_'+new Date().toISOString().slice(0,10);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=me.display_name+' · '+me.access_level;
}
$('go').addEventListener('click',async()=>{const b=$('go');b.disabled=true;b.textContent='Entrando…';$('msg').textContent='';try{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)throw error;await openApp()}catch(e){$('msg').innerHTML='<span class="err">'+esc(e.message||e)+'</span>'}finally{b.disabled=false;b.textContent='Entrar'}});
$('out').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});
async function send(){const t=$('input').value.trim();if(!t||!me)return;$('input').value='';$('chat').insertAdjacentHTML('beforeend','<div class="m u">'+esc(t)+'</div>');$('status').textContent='Yayo está pensando…';try{const{data:{session}}=await sb.auth.getSession();const r=await fetch(SUPABASE_URL+'/functions/v1/ferval-control-v13/chat',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({message:t,session_key:sid})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error de Yayo');$('chat').insertAdjacentHTML('beforeend','<div class="m a">'+esc(j.reply||'Sin respuesta')+'</div>');$('chat').scrollTop=$('chat').scrollHeight}catch(e){$('chat').insertAdjacentHTML('beforeend','<div class="m a err">'+esc(e.message||e)+'</div>')}finally{$('status').textContent=''}}
$('send').addEventListener('click',send);$('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
try{const{data:{session}}=await sb.auth.getSession();if(session)await openApp()}catch{}
</script></body></html>
