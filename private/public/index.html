<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>IAYO PRIVATE</title><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><style>*{box-sizing:border-box}body{margin:0;background:#05070d;color:#f7f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.head{padding:18px;border-bottom:1px solid #242936;display:flex;justify-content:space-between;align-items:center}.mark{font-weight:900;letter-spacing:.08em}.sub{font-size:12px;color:#8f98aa}.chat{flex:1;padding:18px;overflow:auto}.m{padding:12px 14px;border-radius:16px;margin:9px 0;max-width:86%;white-space:pre-wrap}.u{background:#273a77;margin-left:auto}.a{background:#171b25}.bar{display:flex;gap:8px;padding:12px;border-top:1px solid #242936}.bar input{flex:1;background:#10141d;border:1px solid #303747;border-radius:14px;color:#fff;padding:14px;font-size:16px}.bar button,.btn{border:0;border-radius:13px;background:#eef1ff;color:#080b12;padding:12px 15px;font-weight:800}.gate{margin:auto;width:min(92%,430px);background:#10141d;border:1px solid #303747;border-radius:20px;padding:24px}.gate input{width:100%;margin:6px 0;background:#090c12;color:#fff;border:1px solid #303747;border-radius:12px;padding:14px}.hidden{display:none!important}.state{font-size:11px;padding:0 18px 8px;color:#8f98aa}</style></head><body><div id="gate" class="gate"><div class="mark">IAYO PRIVATE</div><p class="sub">Portal privado · propietario único</p><input id="email" type="email" placeholder="Correo"><input id="pass" type="password" placeholder="Contraseña"><button id="enter" class="btn">Entrar</button><button id="claim" class="btn" style="margin-top:8px;background:#273a77;color:white">Crear propietario PRIVATE</button><div id="gateMsg" class="sub"></div></div><div id="app" class="app hidden"><header class="head"><div><div class="mark">IAYO PRIVATE</div><div class="sub">PRIVATE 0.1 · canal personal</div></div><button id="out" class="btn">Salir</button></header><main id="chat" class="chat"><div class="m a">Estoy aquí. Este espacio es privado y está separado de FERVAL.</div></main><div id="state" class="state"></div><form id="form" class="bar"><button id="voice" type="button">🎙️</button><input id="input" autocomplete="off" placeholder="Habla conmigo…"><button>Enviar</button></form></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://eghkhyhevuorhgswewkk.supabase.co','sb_publishable_bDfyieKWPjrNazssEQd6Gg_2OawPjXO',{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]));let me=null,sessionId=null;
async function boot(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data:p,error}=await sb.from('private_profiles').select('user_id,display_name,owner').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!p?.owner){await sb.auth.signOut();throw new Error('Esta cuenta no es el propietario de IAYO PRIVATE.')}me=p;$('gate').classList.add('hidden');$('app').classList.remove('hidden');const{data:s}=await sb.from('private_sessions').insert({user_id:user.id}).select('id').single();sessionId=s?.id||null}
$('claim').onclick=async()=>{const email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<8){$('gateMsg').textContent='Introduce tu correo y una contraseña PRIVATE de al menos 8 caracteres.';return}try{let{data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(!data.session){$('gateMsg').textContent='Revisa el correo de confirmación y después vuelve a pulsar Crear propietario PRIVATE.';return}const{data:ok,error:ce}=await sb.rpc('claim_private_owner',{p_display_name:'Rubén'});if(ce)throw ce;if(!ok)throw new Error('IAYO PRIVATE ya tiene propietario.');await boot()}catch(e){$('gateMsg').textContent=e.message||e}};
$('enter').onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)throw error;await boot()}catch(e){$('gateMsg').textContent=e.message||e}};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
function add(t,k){$('chat').insertAdjacentHTML('beforeend','<div class="m '+k+'">'+esc(t)+'</div>');$('chat').scrollTop=$('chat').scrollHeight}
$('form').onsubmit=async e=>{e.preventDefault();const t=$('input').value.trim();if(!t||!me)return;$('input').value='';add(t,'u');$('state').textContent='IAYO está pensando…';try{const{data:{session}}=await sb.auth.getSession();const r=await fetch('https://eghkhyhevuorhgswewkk.supabase.co/functions/v1/iayo-private-chat',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({message:t,session_id:sessionId})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error PRIVATE');add(d.reply,'a')}catch(e){add(e.message||String(e),'a')}finally{$('state').textContent=''}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const rec=new SR();rec.lang='es-ES';rec.onresult=e=>$('input').value=e.results[0][0].transcript;$('voice').onclick=()=>rec.start()}else $('voice').onclick=()=>{$('state').textContent='Usa el dictado del teclado en este dispositivo.'};
try{const{data:{session}}=await sb.auth.getSession();if(session)await boot()}catch(e){$('gateMsg').textContent=e.message||e}
</script></body></html>
